# [DEMO] docker-compose for local/demo use only. Credentials below are demonstration values,
# not production secrets - see docs-2/ASSUMPTIONS.md.
services:
  postgres:
    image: postgres:16
    container_name: crm-backend-postgres
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports:
      # Host-side 5433, not 5432: the backend/frontend containers talk to postgres over the
      # internal compose network regardless (hostname "postgres", port 5432 there), so this
      # mapping only matters if you want to psql in from the host - and 5432 is commonly already
      # taken by a native Postgres install.
      - "5433:5432"
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-backend-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../front-end
    container_name: crm-frontend
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  crm-postgres-data:
